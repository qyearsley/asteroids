name: CI

# Pull requests as well as pushes, because a check that only runs after the
# push has already landed reports a problem that is already in main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Locked, so CI installs exactly what a developer has rather than
      # resolving afresh and passing on a combination nobody has run.
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No display on a runner, and the game does not need one: every test is
      # written against the logic, and `pygame.init()` is never called.
      - run: uv run pytest -q

[project]
name = "asteroids"
version = "0.1.0"
description = "Classic Asteroids arcade game built with Pygame"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame==2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The game modules live at the repo root, so tests can `import player` etc.
pythonpath = ["."]
markers = [
    "real_logger: opt out of the conftest fixture that muzzles the diagnostic logger",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = [
    "asteroid",
    "asteroidfield",
    "bestresults",
    "circleshape",
    "constants",
    "logger",
    "main",
    "particle",
    "player",
    "rng",
    "shot",
]
force-sort-within-sections = true
